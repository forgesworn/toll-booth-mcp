name: Dependabot auto-merge

# Auto-merges dependabot PRs for low-risk bumps once required checks pass:
#   - devDependencies: patch and minor updates
#   - runtime dependencies: patch updates only
# Runtime minor/major bumps and all majors open a normal PR for deliberate
# human review. Security advisories always open their own PR and follow the
# same gate.
#
# Synced from forgesworn/.github/templates/dependabot/dependabot-auto-merge.yml.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for devDependency patch/minor
        if: >-
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"

      - name: Enable auto-merge for runtime dependency patch only
        if: >-
          steps.meta.outputs.dependency-type == 'direct:production' &&
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
